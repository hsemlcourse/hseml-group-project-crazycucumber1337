name: CI — Lint & Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master, cp1, cp2, cp3]

jobs:
  lint:
    name: Ruff + Flake8 Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install linters
        run: pip install ruff flake8

      - name: Run ruff check on src/ and tests/
        run: ruff check src/ tests/ --line-length 120

      - name: Run flake8 on src/ and tests/
        run: flake8 src/ tests/ --max-line-length=120 --ignore=E203,W503

  tests:
    name: Pytest
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: PYTHONPATH=. pytest tests/ -v --tb=short
